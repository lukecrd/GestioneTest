name: Automatic scheduling
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scheduling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:scheduling
      - run: npm run build
